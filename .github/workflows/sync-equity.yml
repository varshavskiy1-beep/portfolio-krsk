name: sync equity
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EQUITY_RO_SSH_KEY }}" > ~/.ssh/equity_ro
          chmod 600 ~/.ssh/equity_ro
          ssh-keyscan -H 193.109.85.48 >> ~/.ssh/known_hosts
      - name: Pull and append history
        env:
          EQUITY_KEY: ${{ runner.temp }}/../.ssh/equity_ro
        run: |
          export EQUITY_KEY="$HOME/.ssh/equity_ro"
          node scripts/sync-equity.mjs
      - name: Commit if changed
        run: |
          git config user.name "equity-sync"
          git config user.email "equity-sync@users.noreply.github.com"
          git add public/data/latest.json public/data/history.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: sync equity snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
